[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circlescribe-backend"
version = "0.1.0"
description = "CircleScribe hackathon backend"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "strands-agents",
  "boto3>=1.35",
  "numpy>=1.26",
  "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = ["httpx>=0.27"]
audio = ["mlx-whisper"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
